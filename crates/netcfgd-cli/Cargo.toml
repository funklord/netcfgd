[package]
name        = "netcfgd-cli"
description = "ncfg: the netcfgd command-line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "ncfg"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
netcfgd-apply   = { path = "../netcfgd-apply" }
netcfgd-compile = { path = "../netcfgd-compile" }
netcfgd-host    = { path = "../netcfgd-host" }
netcfgd-model   = { path = "../netcfgd-model" }
netcfgd-observe = { path = "../netcfgd-observe" }
netcfgd-plan    = { path = "../netcfgd-plan" }
netcfgd-proto   = { path = "../netcfgd-proto" }
serde.workspace      = true
serde_json.workspace = true
