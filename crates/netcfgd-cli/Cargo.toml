[package]
name        = "netcfgd-cli"
description = "ncfg: the netcfgd command-line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
# `ncfg tui`. On by default; off builds a client that links nothing beyond
# libc, which is what constraint 3 asks of the core and what design section
# 10.2's embedded tier has always listed the TUI as removable from.
default = ["tui"]
tui = ["netcfgd-sys/tui"]

[dependencies]
netcfgd-apply   = { path = "../netcfgd-apply" }
netcfgd-compile = { path = "../netcfgd-compile" }
netcfgd-host    = { path = "../netcfgd-host" }
netcfgd-model   = { path = "../netcfgd-model" }
netcfgd-sys = { path = "../netcfgd-sys" }
netcfgd-observe = { path = "../netcfgd-observe" }
netcfgd-plan    = { path = "../netcfgd-plan" }
netcfgd-proto   = { path = "../netcfgd-proto" }
serde.workspace      = true
serde_json.workspace = true
