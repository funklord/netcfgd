[package]
name        = "netcfgd-plan"
description = "diff(desired, observed) -> an ordered plan of typed, idempotent actions. Pure."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
netcfgd-model = { path = "../netcfgd-model" }
serde.workspace = true

[dev-dependencies]
netcfgd-compile = { path = "../netcfgd-compile" }
# The frozen-surface witness renders a plan as JSON, which is the form it takes
# on the socket and in /run. A dev dependency only: the crate itself is pure
# and serialises through whatever its caller chose.
serde_json.workspace = true
