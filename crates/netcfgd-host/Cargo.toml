[package]
name        = "netcfgd-host"
description = "Everything netcfgd does to the filesystem: read /etc, write /run, materialise hooks."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
netcfgd-apply   = { path = "../netcfgd-apply" }
netcfgd-compile = { path = "../netcfgd-compile" }
netcfgd-model   = { path = "../netcfgd-model" }
netcfgd-observe = { path = "../netcfgd-observe" }
netcfgd-plan    = { path = "../netcfgd-plan" }
netcfgd-proto   = { path = "../netcfgd-proto" }
# For `flock`, and nothing else. Constraint 4 keeps every syscall in one
# audited crate; this crate already reaches it through netcfgd-apply and
# netcfgd-observe, so the edge is a name rather than a new thing in the binary.
netcfgd-sys     = { path = "../netcfgd-sys" }
serde.workspace      = true
serde_json.workspace = true

[dev-dependencies]
netcfgd-testdir = { path = "../netcfgd-testdir" }
