[package]
name        = "netcfgd-observe"
description = "Kernel dumps plus recorded prior state -> the observed model."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
netcfgd-model   = { path = "../netcfgd-model" }
netcfgd-sys = { path = "../netcfgd-sys" }
# For the one observation that is a question to another process rather than a
# read of the kernel: what a running hostapd currently holds in its access
# control lists. `netcfgd-apply` already links this to start and stop one.
netcfgd-secret  = { path = "../netcfgd-secret" }
netcfgd-apply   = { path = "../netcfgd-apply" }
netcfgd-openvpn = { path = "../../backends/netcfgd-openvpn" }
netcfgd-ra      = { path = "../../backends/netcfgd-ra" }
netcfgd-hostapd = { path = "../../backends/netcfgd-hostapd" }

[dev-dependencies]
netcfgd-testdir = { path = "../netcfgd-testdir" }
