[package]
name        = "netcfgd-daemon"
description = "The netcfgd daemon: watch, reconcile, and answer the control socket."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
netcfgd-apply   = { path = "../netcfgd-apply" }
netcfgd-compile = { path = "../netcfgd-compile" }
netcfgd-host    = { path = "../netcfgd-host" }
netcfgd-model   = { path = "../netcfgd-model" }
netcfgd-sys = { path = "../netcfgd-sys" }
netcfgd-observe = { path = "../netcfgd-observe" }
netcfgd-plan    = { path = "../netcfgd-plan" }
netcfgd-proto   = { path = "../netcfgd-proto" }
netcfgd-secret  = { path = "../netcfgd-secret" }
netcfgd-supplicant = { path = "../../backends/netcfgd-supplicant" }
serde_json.workspace = true
