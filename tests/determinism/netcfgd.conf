global {
	dns { mode = "write_resolv_conf" }
}

interface eth0 {
	preference = 100
	config     = "dhcp"
	mtu        = 1492
	dns {
		servers = ["10.0.0.1", "2001:db8::1"]
	}
	qdisc {
		kind      = "cake"
		bandwidth = "100mbit"
	}
}

interface br0 {
	bridge {
		stp = true
	}
	config = "10.9.0.2/24"
}

network "café-guest" {
	wifi { psk = "@secret:cafe" }
}
