# A configuration that names a profile, for the cases about *where* the two
# programs look. `profile get` prints this name where the directory was found
# and "no profile chosen" where it was not, so a case that points the flag here
# and the environment somewhere else can tell which of the two won.
global {
	profile = "office"
}

interface eth0 {
	config = "dhcp"
}
