# A configuration with a wireless network in it, for the verbs that take one
# away. The credential it names is not in this tree: the gate's sequence stores
# it with `ncfg secret set` and then asks `ncfg wifi forget` to remove both, so
# what is committed here is a reference and never a secret.
interface eth0 {
	config = "dhcp"
}

network "Lab" {
	wifi { psk = "@secret:lab" }
}
