; netcfgd taking over dl180g6-01 as it runs today (project.md 10.884): a
; Devuan excalibur vm booting real sysvinit with sysv-rc, ifupdown and
; iptables-persistent configured from the box's own files, then switched to
; netcfgd, probed from outside before and after.
;
;     make hull-takeover
;
; Two machines on two bare segments, `lan` and `storage`, with no network of
; hull's own, so each machine's segments are its eth0 and eth1 as on the
; box: `router` leases the reserved address with dnsmasq and drives the
; probes; `nas` is the box. ib0 is written as eth1: a vm has no InfiniBand.
(build
  (base "docker.io/devuan/devuan:excalibur")
  (steps
    (step
      (name "devuan-server")
      (network true)
      (copy
        (path (from "./interfaces") (to "/etc/network/interfaces"))
        (path (from "./rules.v4") (to "/etc/iptables/rules.v4"))
        (path (from "./rules.v6") (to "/etc/iptables/rules.v6")))
      (run "set -eu
mode=$(stat -c '%04a' /)
[ $mode != 0700 ] || { echo 'this hull leaves a tree root 0700'; exit 1; }
export DEBIAN_FRONTEND=noninteractive
echo 'iptables-persistent iptables-persistent/autosave_v4 boolean false' | debconf-set-selections
echo 'iptables-persistent iptables-persistent/autosave_v6 boolean false' | debconf-set-selections
apt-get -qq update
apt-get -qq install -y --no-install-recommends sysvinit-core sysv-rc ifupdown isc-dhcp-client \\
	iptables iptables-persistent dhcpcd-base python3-minimal dnsmasq-base iproute2 \\
	iputils-ping procps kmod lsb-base
apt-get clean
mkdir -p /usr/lib/modules
# The image's own files, which the package install may have replaced.
test -x /sbin/init
grep -q 'iface eth1 inet static' /etc/network/interfaces
grep -q 'SSH_brute' /etc/iptables/rules.v4
ls /etc/rcS.d | grep -q netfilter-persistent || { echo 'iptables-persistent is not in rcS.d'; exit 1; }
if dpkg -l systemd-sysv 2>/dev/null | grep -q '^ii'; then echo 'systemd-sysv is installed'; exit 1; fi
echo \"devuan image: $(cat /etc/devuan_version), tree root $mode\"")
      (inputs "./interfaces" "./rules.v4" "./rules.v6"))))

(machines
  (router
    (source "netcfgd/devuan-server")
    (mutable overlay)
    (backend vm)
    ; The host's kernel and its modules: hull's own microvm kernel has no
    ; nf_tables, so neither iptables nor netcfgd could load a firewall.
    (tuning (vm (profile full)))
    (network none)
    (memory "1G")
    (cpus 1)
    (segments "lan" "storage")
    (ready (command "sh" "-c" "test -f /tmp/dnsmasq.pid"))
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/router.sh"))
  (nas
    (source "netcfgd/devuan-server")
    (mutable overlay)
    (backend vm)
    (init "/sbin/init")
    (tuning (vm (profile full)))
    (network none)
    (memory "1G")
    (cpus 2)
    (segments "lan" "storage")
    (after router)
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (command "sh" "/payload/nas.sh")))
