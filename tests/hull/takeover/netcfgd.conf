# dl180g6-01 as the NAS, in netcfgd's language: what /etc/network/interfaces
# and rules.v4 said, plus the NAS role's UniFi and scanner rules from -03
# (system-notes, 2026-11-20). ib0 is eth1 here, as in the rig's other files.

interface eth0 { config = "dhcp" }
interface eth1 { config = "10.1.0.1/24" }

firewall {
	input {
		policy = "drop"
		accept "established" { state = ["established", "related"] }
		accept "loopback" { interface = "lo" }
		# rules.v4 drops 127/8 arriving anywhere but lo; lo is accepted above.
		drop "loopback-spoof" { to = ["127.0.0.0/8"] }
		# rules.v4 accepts echo requests only; this accepts ICMP, which keeps
		# path-MTU and unreachable messages working too.
		accept "ping" { protocol = "icmp" }
		# The table is inet, so the drop policy covers IPv6 as well, where
		# rules.v6 accepted everything; neighbour discovery needs this.
		accept "icmpv6" { protocol = "icmpv6" }
		accept "ssh-admin" {
			protocol = "tcp"
			port     = 22
			from     = ["10.0.0.3/32"]
		}
		# rules.v4's brute guard: 9 new connections in 900 s from one
		# address is the first dropped (iptables `recent --hitcount 9`).
		drop "ssh-guard" {
			protocol = "tcp"
			port     = 22
			state    = ["new"]
			over     = "8/15m"
		}
		accept "ssh" {
			protocol = "tcp"
			port     = 22
		}
		accept "nfs-tcp" {
			interface = "eth1"
			protocol  = "tcp"
			port      = [2049, 111, 635, 4045, 4046]
		}
		accept "nfs-udp" {
			interface = "eth1"
			protocol  = "udp"
			port      = [2049, 111, 635, 4045, 4046]
		}
		accept "unifi-tcp" {
			protocol = "tcp"
			port     = [8080, 8443, 8880, 8843, 27117]
		}
		accept "unifi-stun" {
			protocol = "udp"
			port     = 3478
		}
		accept "scanner-ftp" {
			protocol = "tcp"
			port     = 21
			from     = ["10.0.0.20/32"]
		}
	}
}
