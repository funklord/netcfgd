; Band steering between two access points netcfgd runs (project.md 10.595):
; three hwsim radios in one vm: netcfgd runs the network on 2.4 and on 5 GHz,
; and a station joined on 2.4 GHz is moved to 5. The regdom rig's image,
; which has hostapd, wpa_supplicant and iw and nothing netcfgd-specific; the
; repository is
; mounted read-only and the payload runs the host's build of it.
;
;     make hull-steer   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
