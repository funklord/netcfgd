; Advisory steering between two access points netcfgd runs (project.md
; 10.595 item 2): three hwsim radios in one vm, netcfgd running the network on
; two 2.4 GHz radios, and a station made weak by its transmit power that is
; asked to move and does. The regdom rig's image, which has hostapd,
; wpa_supplicant and iw and nothing netcfgd-specific; the repository is
; mounted read-only and the payload runs the host's build of it.
;
;     make hull-steer   ; runs this and hull.conf, building the C first
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/weak.sh"))
