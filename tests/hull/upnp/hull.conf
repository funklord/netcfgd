; UPnP IGD and NAT-PMP on a router netcfgd runs (project.md 10.667, 10.670):
; one vm, three network namespaces joined by veths -- a host on the LAN asking
; for a mapping with `upnpc`, the router running netcfgd and the miniupnpd it
; starts, and a host on the uplink side that must reach the LAN host through
; the mapping and must not reach it without one.
;
; A vm rather than a container because the router writes nftables, and the
; kernel's tables are the host's in a container.
;
;     make hull-upnp   ; builds the C, and the image when it is absent
;
; The paths are relative to this directory, as the other rigs' are.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "upnp-tools")
      ; `(network true)`, without which `apt-get update` fetches nothing and
      ; exits 0 anyway -- hwsim's spec records what that once cost.
      (network true)
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700, so nothing non-root'
	echo 'can run in a step: it needs b7126fe or later.'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
# miniupnpd-nftables is the backend netcfgd starts; miniupnpd alone is its
# configuration and scripts. miniupnpc is the client the LAN host asks with.
# **iptables first, in an install of its own.** miniupnpd's debconf `config`
# script asks `update-alternatives --query iptables`, and it runs at
# preconfigure -- before iptables' own postinst has registered the
# alternative -- so one install of both failed (status 20 without iptables,
# 128 with it in the same install). uuid-runtime because the postinst calls
# `uuidgen` for the conffile it keeps.
apt-get -qq install -y --no-install-recommends kmod iproute2 nftables iptables \\
	uuid-runtime python3-minimal util-linux
apt-get -qq install -y --no-install-recommends miniupnpd miniupnpd-nftables miniupnpc
apt-get clean
mkdir -p /usr/lib/modules
for t in modprobe ip nft miniupnpd upnpc python3; do
	command -v $t >/dev/null || { echo \"missing from the image: $t\"; exit 1; }
done
echo \"upnp image: tree root $mode\"")
      (inputs))))

(machine
  (source "netcfgd/upnp")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
