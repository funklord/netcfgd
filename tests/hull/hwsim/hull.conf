; `hwsim.sh` in a hull vm, because that test needs a kernel of its own.
;
; The container tier cannot run it: a container shares the host's kernel, and
; this host has no `mac80211_hwsim`. The host cannot either, the script wanting
; real root. A vm has both, and `hwsim.sh` passed 27 checks in one on
; 2026-10-22, against hull 4161c8a -- the first time this workspace has run it.
;
;     make hull-hwsim   ; builds the image when it is absent, then runs
;     make hull-image   ; builds all four again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory, and the build form
; below lives in this same file.
;     hull build -f tests/hull/hwsim/hull.conf netcfgd/hwsim
;     hull run   -f tests/hull/hwsim/hull.conf
;
; **Built by hull rather than exported from docker**, since 2026-10-25, which
; is project.md 10.558. The export dropped every owner and every setuid bit,
; so the old `bake-rootfs.sh` restored modes with `chmod` from the image's own
; listing and could restore no owner at all; a built image carries both. It
; needs a hull with `b7126fe`, which made a materialized tree root traversable,
; and the step checks that property rather than a version.
;
; The paths are relative to this directory, so it is run from here.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "hwsim-tools")
      ; `(network true)`, without which `apt-get update` fetches nothing and
      ; exits 0 anyway -- which once read as four packages hull could not find.
      (network true)
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700, so nothing non-root'
	echo 'can run in a step: it needs b7126fe or later, and the header says why.'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
# hostapd for the ap-lease rig, the one that needs an access point and a DHCP
# server in one kernel; hwsim.sh's own AP is wpa_supplicant's AP mode and does
# not look for it. radvd for the dhcp-server rig's DHCPv6 stage: a static prefix
# advertised with the managed flag is what tells a host to ask (0304).
apt-get -qq install -y --no-install-recommends build-essential kmod iw wpasupplicant hostapd iproute2 dnsmasq-base dhcpcd-base iputils-ping radvd
apt-get clean
# The mount point for the host's modules; see the volume below.
mkdir -p /usr/lib/modules
for t in cc make modprobe iw wpa_supplicant wpa_cli hostapd ip dnsmasq dhcpcd ping radvd; do
	command -v $t >/dev/null || { echo \"missing from the image: $t\"; exit 1; }
done
echo \"hwsim image: tree root $mode, $(cc --version | head -1)\"")
      (inputs))))

(machine
  (source "netcfgd/hwsim")
  ; **overlay, and the packages are already in the rootfs.** An overlay's upper
  ; layer is a tmpfs in the guest, so it holds only this run's writes -- the
  ; test's work directory and its logs. Installing packages into it truncates
  ; them silently, and `(mutable direct)` cannot install at all: a 9p share
  ; writes as the host user, so dpkg's chown fails. That is why the packages
  ; are in the built image above rather than installed at run time; the bake
  ; script that used to carry this argument is gone (project.md 10.558).
  (mutable overlay)
  (backend vm)
  (memory "4G")
  (cpus 4)
  (volumes
    ; **The host's modules, named rather than left to hull's own share**, which
    ; `mac80211_hwsim` is the whole point of having. hull mounts
    ; `/usr/lib/modules/<release>` itself for a `dir:` source above an overlay
    ; and, measured 2026-10-25, not for a stored one. Naming the whole tree is
    ; better regardless: the guest runs the host's kernel, so `uname -r`
    ; resolves inside and no kernel version is pinned here.
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    ; The tree read-only, for the test and the host-built binaries it runs.
    (volume (host "../../..") (guest "/repo") (mode ro))
    ; And this directory, for the payload. A volume is a directory on qemu:
    ; naming a file gets `cannot initialize fsdev`.
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
