; netcfgd's two init scripts in a guest OpenRC booted.
;
; `make vm-init` runs the same payload on this tree's own VM tier and can only
; exercise one of the two: a systemd guest cannot install openrc. This boots
; `/sbin/openrc-init`, so the openrc-run script runs under the init it is
; written for -- 28 lines that had never executed anywhere before 2026-10-23.
;
;     make hull-openrc  ; bakes the guest when it is absent, then runs
;     make hull-image   ; bakes all three again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory.
;     sh tests/hull/openrc/bake-rootfs.sh dist/hull/openrc-rootfs
;     hull run -f tests/hull/openrc/hull.conf
(machine
  (source "dir:../../../dist/hull/openrc-rootfs")
  (mutable overlay)
  (backend vm)
  ; **openrc-init, not /sbin/init.** The image has sysvinit too, and booting
  ; that leaves openrc installed-but-not-booted, where it refuses to manage a
  ; service and every check measures the environment.
  (init "/sbin/openrc-init")
  (memory "2G")
  (cpus 2)
  (volumes
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
