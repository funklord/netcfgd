; netcfgd's two init scripts in a guest OpenRC booted.
;
; `make vm-init` runs the same payload on this tree's own VM tier and can only
; exercise one of the two: a systemd guest cannot install openrc. This boots
; `/sbin/openrc-init`, so the openrc-run script runs under the init it is
; written for -- 28 lines that had never executed anywhere before 2026-10-23.
;
;     make hull-openrc  ; builds the image when it is absent, then runs
;     make hull-image   ; builds all four again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory, and the build form
; below lives in this same file.
;     hull build -f tests/hull/openrc/hull.conf netcfgd/openrc
;     hull run   -f tests/hull/openrc/hull.conf
;
; **Built by hull rather than exported from docker**, since 2026-10-25, which
; is project.md 10.558: a built image carries its owners and setuid bits --
; `start-stop-daemon` and `su` are the ones that matter here -- where an
; export through `tar -x` as an ordinary user drops both.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "openrc-init")
      (network true)
      ; The `localmount` stand-in is copied in rather than written by the run
      ; line, so it stays a file somebody can read; `inputs` keys the cache on
      ; its contents. Its own header says why a Debian image needs one.
      (copy (path (from "./localmount") (to "/etc/init.d/localmount")))
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700: needs b7126fe or later'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends sysvinit-core openrc lsb-base util-linux iproute2
apt-get clean
mkdir -p /usr/lib/modules
[ -x /sbin/init ] || { echo 'no /sbin/init'; exit 1; }
[ -x /sbin/openrc-run ] || { echo 'no openrc-run'; exit 1; }
[ -x /sbin/openrc-init ] || { echo 'no openrc-init'; exit 1; }
# **systemd must not be the init here**, which is the whole point of the image:
# if `systemd-sysv` is in, openrc is out and this is the guest the VM tier
# already has.
if dpkg -l systemd-sysv 2>/dev/null | grep -q '^ii'; then
	echo 'systemd-sysv is installed, so this is not a sysvinit image'
	exit 1
fi
chmod 0755 /etc/init.d/localmount
sh -n /etc/init.d/localmount || { echo 'the localmount stand-in does not parse'; exit 1; }
echo \"openrc image: tree root $mode, openrc $(dpkg-query -W -f='${Version}' openrc)\"")
      (inputs "./localmount"))))

(machine
  (source "netcfgd/openrc")
  (mutable overlay)
  (backend vm)
  ; **openrc-init, not /sbin/init.** The image has sysvinit too, and booting
  ; that leaves openrc installed-but-not-booted, where it refuses to manage a
  ; service and every check measures the environment.
  (init "/sbin/openrc-init")
  (memory "2G")
  (cpus 2)
  (volumes
    ; The host's modules, named rather than left to hull's own share, which is
    ; given to a `dir:` source above an overlay and not to a stored one
    ; (measured 2026-10-25).
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
