; Handing a router's network from netifd to netcfgd and back (project.md
; 10.874), with the switcher the package ships, under procd, on the image
; `hull-openwrt` builds. See payload.sh for what is checked.
;
;     make hull-openwrt-select
;
; 128 MB, a router's.
(machine
  (source "netcfgd/openwrt")
  (mutable overlay)
  (backend vm)
  (init "/sbin/init")
  (memory "128M")
  (cpus 1)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
