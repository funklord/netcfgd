; netcfgd on a real big-endian kernel, under procd, in 128 MB (project.md 10.742):
; OpenWrt's own malta-be build, kernel and rootfs together, in qemu-system-mips,
; running what `tests/hull/openwrt/payload.sh` runs on x86. netcfgd is built with
; OpenWrt's own toolchain, so against musl, the libc a router has.
;
; `hull-mips` runs the suite under qemu-user, which cannot translate most of
; rtnetlink. This is the half that needs a kernel: every netlink message netcfgd
; sends and every observation it reads, in the byte order of the machine.
;
; A vm carrying a second emulator, since this machine has no qemu-system-mips and
; nothing is installed on it. Everything fetched is pinned by checksum.
;
;     make hull-malta
(build
  (base "docker.io/library/debian:12")
  (steps
    (step
      (name "malta-tools")
      (network true)
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends qemu-system-mips make python3 cpio zstd curl ca-certificates file gcc libc6-dev meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
# OpenWrt 25.12, whose packages -- the kernel modules here, and netcfgd's -- are
# apk-tools 3's (project.md 10.813), so apk-tools 3.0.2 is built here as the
# Makefile's `apk-tools` builds it, pinned by the same hash.
base=https://downloads.openwrt.org/releases/25.12.0/targets/malta/be
kernel=openwrt-25.12.0-malta-be-vmlinux-initramfs.elf
toolchain=openwrt-toolchain-25.12.0-malta-be_gcc-14.3.0_musl.Linux-x86_64.tar.zst
kmods=kmods/6.12.71-1-28f6eacf1dbe0490f0d4b22a8ea6104b
apktools=https://gitlab.alpinelinux.org/alpine/apk-tools/-/archive/v3.0.2/apk-tools-v3.0.2.tar.gz
mkdir -p /malta/toolchain /malta/module /malta/veth /malta/apk-tools
cd /malta
curl -fsSo vmlinux.elf $base/$kernel
curl -fsSo toolchain.tar.zst $base/$toolchain
curl -fsSo dummy.apk $base/$kmods/kmod-dummy-6.12.71-r1.apk
curl -fsSo veth.apk $base/$kmods/kmod-veth-6.12.71-r1.apk
curl -fsSLo apk-tools.tar.gz $apktools
sha256sum -c <<'SUMS'
f9ce03834fff2edd8a77b82537afc3b27f3ffb7a8dc5be7ab0d54b254d1e3ae8  vmlinux.elf
86734d8ffcd50313960794411cbd5e5dd3c418568a17bb9a3b65926027d1e3f8  toolchain.tar.zst
39bed1c64fc12fc520eb6d5dea67a51904a35005158029b7068773fc664decd1  dummy.apk
a426bf391fe70271d1f505bc45a6a7e2e2e9f797b32d878b8d55a112cd7aa7c8  veth.apk
987cef95e3b1cb3a365e016c9ab2566aaf440bccdc15a1650cdd0cd5ea3209e4  apk-tools.tar.gz
SUMS
tar --zstd -xf toolchain.tar.zst -C toolchain --strip-components=1
tar xzf apk-tools.tar.gz -C apk-tools
meson setup apk-tools/build apk-tools/apk-tools-v3.0.2 -Ddocs=disabled -Dhelp=disabled -Dlua=disabled -Dpython=disabled -Dtests=disabled > /dev/null
ninja -C apk-tools/build > /dev/null
apk=/malta/apk-tools/build/src/apk
$apk extract --allow-untrusted --destination module dummy.apk
$apk extract --allow-untrusted --destination veth veth.apk
ls toolchain/toolchain-*/bin/mips-openwrt-linux-musl-gcc module/lib/modules/*/dummy.ko
ls veth/lib/modules/*/veth.ko $apk
rm toolchain.tar.zst dummy.apk veth.apk apk-tools.tar.gz")
      (inputs))))

(machine
  (source "netcfgd/malta")
  (mutable overlay)
  (backend vm)
  (memory "2G")
  (cpus 4)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
