; netcfgd on a real big-endian kernel, under procd, in 128 MB (project.md 10.742):
; OpenWrt's own malta-be build, kernel and rootfs together, in qemu-system-mips,
; running what `tests/hull/openwrt/payload.sh` runs on x86. netcfgd is built with
; OpenWrt's own toolchain, so against musl, the libc a router has.
;
; `hull-mips` runs the suite under qemu-user, which cannot translate most of
; rtnetlink. This is the half that needs a kernel: every netlink message netcfgd
; sends and every observation it reads, in the byte order of the machine.
;
; A vm carrying a second emulator, since this machine has no qemu-system-mips and
; nothing is installed on it. Everything fetched is pinned by checksum.
;
;     make hull-malta
(build
  (base "docker.io/library/debian:12")
  (steps
    (step
      (name "malta-tools")
      (network true)
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends qemu-system-mips make python3 cpio zstd curl ca-certificates file
base=https://downloads.openwrt.org/releases/24.10.4/targets/malta/be
kernel=openwrt-24.10.4-malta-be-vmlinux-initramfs.elf
toolchain=openwrt-toolchain-24.10.4-malta-be_gcc-13.3.0_musl.Linux-x86_64.tar.zst
module=kmods/6.6.110-1-4880f58f355f8d52fbb2985e0e649b73/kmod-dummy_6.6.110-r1_mips_24kc.ipk
mkdir -p /malta/toolchain /malta/module
cd /malta
curl -fsSo vmlinux.elf $base/$kernel
curl -fsSo toolchain.tar.zst $base/$toolchain
curl -fsSo dummy.ipk $base/$module
sha256sum -c <<'SUMS'
4f9787bdc63997c0c37b0d083bc726ec0b2dcec94486cf95ce29488b4116b30c  vmlinux.elf
d40eb2a77cf41cdfb55ed032d095a0639366048a578cf6288972afbcf6a00f25  toolchain.tar.zst
a4ff5c823ea25813c0b1d531ee56d67c70d7dceed4d58294b2677976e8623813  dummy.ipk
SUMS
tar --zstd -xf toolchain.tar.zst -C toolchain --strip-components=1
tar xzf dummy.ipk -C module
tar xzf module/data.tar.gz -C module
ls toolchain/toolchain-*/bin/mips-openwrt-linux-musl-gcc module/lib/modules/*/dummy.ko
rm toolchain.tar.zst dummy.ipk")
      (inputs))))

(machine
  (source "netcfgd/malta")
  (mutable overlay)
  (backend vm)
  (memory "2G")
  (cpus 4)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
