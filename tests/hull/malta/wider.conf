device wan0 {
	kind = "dummy"
}
device lan0 {
	kind = "dummy"
}
device lan1 {
	kind = "dummy"
}
device br0 {
	bridge {
		members = ["lan1"]
	}
}
device vlan10 {
	vlan {
		parent = "lan0"
		id     = 10
	}
}
interface wan0 {
	config = "203.0.113.1/24"
	forwarding = true
	routes = "198.51.100.0/24 via 203.0.113.2"
	port_forward "web" {
		protocol = "tcp"
		port     = 443
		to       = "192.168.1.10"
		to_port  = 8443
	}
}
interface lan0 {
	config = "192.168.1.1/24"
	forwarding = true
}
interface br0 {
	config = "192.168.2.1/24"
}
interface vlan10 {
	config = "192.168.10.1/24"
}
firewall {
	input {
		policy = "accept"
		drop "netbios" {
			protocol = "udp"
			port     = [137, 138]
		}
	}
}
