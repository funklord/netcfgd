device wan0 {
	kind = "dummy"
}
device lan0 {
	kind = "dummy"
}
device lan1 {
	kind = "dummy"
}
device br0 {
	bridge {
		members = ["lan1"]
	}
}
device vlan10 {
	vlan {
		parent = "lan0"
		id     = 10
	}
}
interface wan0 {
	config = "203.0.113.1/24"
	forwarding = true
	routes = "198.51.100.0/24 via 203.0.113.2"
	clamp_mss = true
	port_forward "web" {
		protocol = "tcp"
		port     = 443
		to       = "192.168.1.10"
		to_port  = 8443
		from     = "198.51.100.0/24"
	}
}
interface lan0 {
	config = "192.168.1.1/24"
	forwarding = true
}
interface br0 {
	config = "192.168.2.1/24"
}
interface vlan10 {
	config = "192.168.10.1/24"
}
firewall {
	input {
		policy = "accept"
		accept "established" {
			state = ["established", "related"]
		}
		drop "netbios" {
			protocol = "udp"
			port     = [137, 138]
		}
		accept "games" {
			protocol = "udp"
			port     = "27000-27015"
		}
		accept "ping" {
			protocol  = "icmp"
			icmp_type = "echo-request"
		}
		accept "nd" {
			protocol  = "icmpv6"
			icmp_type = ["nd-neighbor-solicit", 136]
		}
		drop "ssh-guard" {
			protocol = "tcp"
			port     = 22
			state    = ["new"]
			over     = "8/15m"
		}
		reject "ident" {
			protocol = "tcp"
			port     = 113
			reset    = true
			log      = true
		}
		accept "gre" {
			protocol = "gre"
			from     = ["198.51.100.7"]
		}
		accept "diameter" {
			protocol = "sctp"
			port     = 3868
		}
	}
}
