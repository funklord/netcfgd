; `sandbox_writes.sh` in a hull vm under the image's own systemd.
;
; This tree has its own VM tier for this script (`make vm-sandbox`, 0265) and
; this is the same payload on hull instead: one spec, one `hull run`, no image
; of its own under `~/vm`. 31 checks is what the native tier got on 2026-10-07,
; which is the number to compare against.
;
;     sh tests/hull/sandbox/bake-rootfs.sh     # once, and after a package change
;     cd tests/hull/sandbox && hull run -f hull.conf
(machine
  (source "dir:../../../dist/hull-sandbox-rootfs")
  (mutable overlay)
  (backend vm)
  ; **The image's init, which is what the script is here for.** Without it the
  ; agent is PID 1, `systemd-run` has nothing to talk to, and the one block
  ; this whole tier exists for cannot run.
  (init "/sbin/init")
  (memory "4G")
  (cpus 4)
  (volumes
    ; `/mnt/repo`, because netcfgd's own payload expects it there.
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
