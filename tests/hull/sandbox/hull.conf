; `sandbox_writes.sh` in a hull vm under the image's own systemd.
;
; This tree has its own VM tier for this script (`make vm-sandbox`, 0265) and
; this is the same payload on hull instead: one spec, one `hull run`, no image
; of its own under `~/vm`. 31 checks is what the native tier got on 2026-10-07,
; which is the number to compare against.
;
;     make hull-sandbox ; builds the image when it is absent, then runs
;     make hull-image   ; builds all four again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory, and the build form
; below lives in this same file.
;     hull build -f tests/hull/sandbox/hull.conf netcfgd/sandbox
;     hull run   -f tests/hull/sandbox/hull.conf
;
; **Built by hull rather than exported from docker**, since 2026-10-25, which
; is project.md 10.558: a built image carries its owners and setuid bits where
; an export as an ordinary user drops both.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "sandbox-systemd")
      ; `(network true)`, without which `apt-get update` fetches nothing and
      ; exits 0 anyway.
      (network true)
      ; **This package set is why the rig baked with docker until 2026-10-25.**
      ; A build step mapped one uid, so `systemd-sysv`'s maintainer scripts
      ; could not give a file to their own system user. hull maps many uids
      ; since 2026-10-23 and made the tree root traversable in `b7126fe`;
      ; measured here, the set installs with `systemd-network:998` and
      ; `messagebus:997` created and files owned by them (project.md 10.557).
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700, so a maintainer'
	echo 'script cannot act as its own user: it needs b7126fe or later.'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends systemd systemd-sysv udev dbus util-linux iproute2
apt-get clean
mkdir -p /usr/lib/modules
for t in systemctl systemd-run setpriv unshare timeout; do
	command -v $t >/dev/null || { echo \"missing from the image: $t\"; exit 1; }
done
[ -x /sbin/init ] || { echo 'no /sbin/init in the image'; exit 1; }
getent passwd systemd-network >/dev/null || { echo 'no systemd-network user'; exit 1; }
echo \"sandbox image: tree root $mode, systemd $(systemctl --version | head -1 | cut -d' ' -f2)\"")
      (inputs))))

(machine
  (source "netcfgd/sandbox")
  (mutable overlay)
  (backend vm)
  ; **The image's init, which is what the script is here for.** Without it the
  ; agent is PID 1, `systemd-run` has nothing to talk to, and the one block
  ; this whole tier exists for cannot run.
  (init "/sbin/init")
  (memory "4G")
  (cpus 4)
  (volumes
    ; The host's modules, named rather than left to hull's own share: it is
    ; mounted for a `dir:` source above an overlay and not for a stored one,
    ; measured 2026-10-25. systemd's `modules-load` wants the place to exist.
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    ; `/mnt/repo`, because netcfgd's own payload expects it there.
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
