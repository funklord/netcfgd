; tests/live/suspend.sh in a hull vm: netcfgd across a real suspend and resume
; (project.md 10.790, 10.809). The hwsim image, which has the radios' module, an
; access point, a DHCP server and a compiler; the guest suspends itself and asks
; its own RTC alarm to wake it, as `rtcwake` does on a laptop.
;
; **`(sleep true)` on a stored image needs hull 5772098 or later** -- earlier the
; guest never came back (10.773), and then a stored image was refused under a
; block projection (10.809) -- **and a block root with block volumes only**: Linux's 9p and
; virtiofs cannot carry a suspend, so nothing here is a shared directory. The
; Makefile builds the images under build/: the binaries, suspend.sh and the
; payload in repo.img, the host kernel's modules in modules-<release>.img, and a
; fresh verdict.img the guest writes and the host reads back with debugfs.
;
;     make hull-suspend
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  (projection block)
  (sleep true)
  (memory "4G")
  (cpus 4)
  (volumes
    (volume (block "build/modules.img") (guest "/usr/lib/modules") (mode ro))
    (volume (block "build/repo.img") (guest "/repo") (mode ro))
    (volume (block "build/verdict.img") (guest "/verdict") (mode rw)))
  (command "sh" "/repo/payload.sh"))
