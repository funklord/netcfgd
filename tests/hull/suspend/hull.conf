; tests/live/suspend.sh in a hull vm: netcfgd across a real suspend and resume
; (project.md 10.790). The hwsim image, which has the radios' module, an access
; point, a DHCP server and a compiler; the guest suspends itself and asks its
; own RTC alarm to wake it, as `rtcwake` does on a laptop.
;
; **Needs a hull whose vm guest wakes on its RTC alarm and whose devices and
; shares survive the cycle.** Measured against hull 50071a9 they did not
; (10.773): the guest went quiet at the device step and never came back. Asked
; of hull in its inbox; the holder has said hull will do it. Until then the run
; ends at the Makefile's timeout, which is that answer.
;
;     make hull-suspend
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  (memory "4G")
  (cpus 4)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw)))
  (command "sh" "/payload/payload.sh"))
