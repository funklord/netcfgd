; netcfgd under OpenWrt's procd (project.md 10.672): the routers expected
; next run OpenWrt, and `packaging/procd/netcfgd` had never been executed.
;
; A vm booting the OpenWrt root filesystem's own init as PID 1 (hull's
; `(init ...)`), so procd is procd; the kernel is the host's, as every vm
; here has it, and carries none of its modules -- `make hull-openwrt` hands
; the guest the host's dummy module, decompressed. netcfgd is the C linked
; statically, because OpenWrt's libc is musl and the tree builds against
; glibc.
;
;     make hull-openwrt   ; builds the C, the static link and the image
;
; 128 MB, a router's, since the routers are the point: at 512 MB this passed
; with a program no 128 MB machine could exec (10.740). 64 MB is not a
; measurement of netcfgd: the host's kernel panics there before init.
(build
  ; 25.12, the stable release since 2026-03, whose package manager is apk;
  ; 24.10's security updates end 2026-09 (project.md 10.812). The image is
  ; netcfgd/openwrt whatever the base, so a store holding one built from an
  ; older base keeps it: the verdict names the release that ran.
  (base "docker.io/openwrt/rootfs:x86-64-25.12.0")
  (steps
    (step
      (name "openwrt-look")
      ; Nothing installed: the point is the stock image. Asked rather than
      ; assumed, so a base whose layout moved fails here and not in the run.
      (run "ls /sbin/init /sbin/procd /etc/rc.common >/dev/null && head -2 /etc/openwrt_release")
      (inputs))))

(machine
  (source "netcfgd/openwrt")
  (mutable overlay)
  (backend vm)
  (init "/sbin/init")
  (memory "128M")
  (cpus 1)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
