; 160 MHz on an access point netcfgd runs (project.md 10.599): two hwsim
; radios in one vm, netcfgd's access point on channel 100 with `width = 160`,
; through the minute of radar listening its block takes, and a station that
; must associate at 160 MHz. The regdom rig's image, which has hostapd,
; wpa_supplicant and iw and nothing netcfgd-specific; the repository is
; mounted read-only and the payload runs the host's build of it.
;
;     make hull-width   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
