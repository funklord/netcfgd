; A DHCP server netcfgd configures (decision 0297, project.md 10.601): one vm,
; a veth pair, netcfgd's `dhcp_server` on one end and a dhcpcd client in a
; namespace on the other. The hwsim rig's image, which has dnsmasq-base and
; dhcpcd-base and nothing netcfgd-specific; the repository is mounted
; read-only and the payload runs the host's build of it.
;
;     make hull-dhcp-server   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
