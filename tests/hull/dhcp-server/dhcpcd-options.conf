# The custom options (decision 0303), declared to dhcpcd with the width each
# type means, so a value dnsmasq sent at another width is refused by the
# client rather than misread. 150 is dhcpcd's own `tftp_servers`.
define 224 string motd
define 225 uint16 mtu2
define 226 uint32 big
define 227 byte flag
define 228 binhex raw
define 229 binhex one
define 230 byte small
option tftp_servers, motd, mtu2, big, flag, raw, one, small
