; A station on netcfgd's access point, leased an address and named by
; netcfgd's DHCP server (project.md 10.604): one vm, two hwsim radios, the
; access point and the server on wlan0 and a station in a namespace on wlan1.
; The hwsim rig's image, which has hostapd beside dnsmasq and dhcpcd for this.
;
;     make hull-ap-lease   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
