; The same two machines, with the wire losing three frames in ten each way.
;
; **A second file rather than a variable, because a hull.conf takes none.** The
; payloads are shared -- only the impairment differs -- and duplicating the
; machines is the cost of that. The kernel tier generates its specs from a
; shell heredoc for the same reason; here the difference is two lines, so a
; file somebody can read beats a file somebody generates.
;
;     make hull-delegation-lossy
;
; **Why it is worth a rig: netcfgd has never been tested under loss.** 10.570
; named this as what hull's impairment reaches, and what it asks of netcfgd is
; whether a prefix still arrives when the solicit does not -- odhcp6c retries,
; and a client that gave up would leave the reference in the document pointing
; at nothing with no error anywhere.
;
; `loss` is netem's, applied in the switch: `out` where a frame enters from its
; machine and `in` where it leaves towards one, so a frame from the CPE to the
; ISP crosses the CPE's out and then the ISP's in -- two independent draws, so
; three in ten each way is worse than three in ten end to end.
(machines
  (isp
    (source "netcfgd/delegation")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "pd")
    (impair (pd (out (loss 0.3)) (in (loss 0.3))))
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/isp.sh"))
  (cpe
    (source "netcfgd/delegation")
    (mutable overlay)
    (backend vm)
    (memory "2G")
    (cpus 2)
    (segments "pd")
    (impair (pd (out (loss 0.3)) (in (loss 0.3))))
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (command "sh" "/payload/cpe.sh")))
