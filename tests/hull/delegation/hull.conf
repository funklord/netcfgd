; DHCPv6 prefix delegation across a wire: an ISP on one machine, netcfgd on the
; other, and the assertion that the prefix handed out is the prefix configured.
;
;     make hull-delegation
;
; **This is what tests/hull/wire/ was built for.** That rig proved the harness
; -- two machines on a segment, a verdict per machine, and an absent verdict
; failing the run -- against a payload that did nothing. This one carries the
; work: the assertion is relational, which is what 10.570 named as the hard
; part, and the collector it needs already exists.
;
; **The image builds odhcp6c from source, because Debian does not package it**
; and decision 0050 is why netcfgd will not pretend dhcpcd can do this instead.
; The recipe is `tests/live/delegation.sh`'s own, including the dependency a
; shorter version got wrong -- `libjson-c-dev`, without which libubox stops at
; "None of the required 'json-c' found" on a clean trixie.
;
; **The build deps are purged in the same step that uses them.** A step's tree
; is what the image keeps, so installing cmake and build-essential and leaving
; them would cost the image several hundred megabytes for a binary of a few
; dozen kilobytes.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "delegation-tools")
      (network true)
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
# kmod, because the CPE wants a dummy device for its LAN side and the kernel
# autoloads a link kind by calling modprobe, which a slim image does not have.
# Without it ip link add fails and the sysctl that follows reports a missing
# /proc path, which names the symptom two steps from the cause.
apt-get -qq install -y --no-install-recommends kea-dhcp6-server iproute2 iputils-ping kmod
# **ca-certificates is this image own addition to the recipe.** A slim image
# has none, so git clone over https fails with a complaint about the SSL CA
# cert path or access rights, which reads like a proxy or a permissions fault
# and is neither. The recipe in tests/live/delegation.sh assumes a full system,
# exactly as it did before libjson-c-dev was added to it.
#
# **No apostrophes or double quotes in these comments.** They sit inside a
# hull string, so a quote closes it early and the parser then meets # outside
# a string and reports octets holding a byte that is not a hexadecimal digit --
# which is a true message about a cause five lines away.
apt-get -qq install -y --no-install-recommends git ca-certificates cmake build-essential pkg-config libjson-c-dev
cd /tmp
git clone --depth 1 https://github.com/openwrt/libubox
cd libubox
cmake -B build -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
cmake --build build
cmake --install build
ldconfig
cd /tmp
git clone --depth 1 https://github.com/openwrt/odhcp6c
cd odhcp6c
cmake -B build
cmake --build build
install -m 0755 build/odhcp6c /usr/local/bin/odhcp6c
cd /
rm -rf /tmp/libubox /tmp/odhcp6c
apt-get -qq purge -y git cmake build-essential pkg-config libjson-c-dev
apt-get -qq autoremove -y
apt-get clean
rm -rf /var/lib/apt/lists/*
# **Each tool is asked for by name, because a build that produced less than it
# was asked for is this workspace's named failure.** libubox installs a shared
# library odhcp6c links, so a binary that cannot find it at run time is the
# interesting way this fails -- `--version` would do, but odhcp6c has none, so
# the loader is asked instead.
command -v kea-dhcp6 >/dev/null || { echo 'no kea-dhcp6'; exit 1; }
command -v modprobe >/dev/null || { echo 'no modprobe'; exit 1; }
# kea writes a DUID on first start and the slim image has no state directory
# for it, so the server configures and then refuses to initialise.
mkdir -p /var/lib/kea
command -v odhcp6c >/dev/null || { echo 'no odhcp6c'; exit 1; }
ldd /usr/local/bin/odhcp6c | grep -q 'not found' && { ldd /usr/local/bin/odhcp6c; exit 1; }
echo \"delegation image: kea $(dpkg-query -W -f='${Version}' kea-dhcp6-server), odhcp6c built\"")
      (inputs))))

(machines
  (isp
    (source "netcfgd/delegation")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "pd")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    ; Up once kea is serving, which isp.sh says as `VERDICT ok`; the CPE is
    ; started only then, since a solicit before kea listens goes unanswered and
    ; odhcp6c does not retry for ever (hull's start order, hull 1330cae).
    (ready (command "grep" "-q" "^VERDICT ok" "/verdict/isp") (interval "1s") (timeout "1m"))
    (command "sh" "/payload/isp.sh"))
  (cpe
    (source "netcfgd/delegation")
    (mutable overlay)
    (backend vm)
    (memory "2G")
    (cpus 2)
    (segments "pd")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (after isp)
    (command "sh" "/payload/cpe.sh")))
