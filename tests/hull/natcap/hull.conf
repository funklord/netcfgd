; What a kernel says when it cannot do NAT, in a guest whose module autoload
; this rig controls.
;
; The two states netcfgd's NAT sentence is about -- no `nft_chain_nat`, no
; `nft_masq` -- cannot occur on a host that has them, and a container or a
; namespace shares that host's kernel. A vm has a kernel of its own, boots with
; an empty module table, and has its own `/proc/sys/kernel/modprobe`: blocking
; autoload there makes a construct unreachable exactly as compiling it out
; would, because the lookup that fails does not care why the module is absent.
;
;     make hull-natcap   ; bakes the guest when it is absent, then runs
;     make hull-image    ; bakes all four again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory.
;     sh tests/hull/natcap/bake-rootfs.sh dist/hull/natcap-rootfs
;     hull run -f tests/hull/natcap/hull.conf
(machine
  (source "dir:../../../dist/hull/natcap-rootfs")
  ; overlay, so the guest's writes are its own and go with it. Nothing is
  ; installed at run time; `bake-rootfs.sh` has the whole of why.
  (mutable overlay)
  ; **vm, and nothing else will do.** A container shares the host's kernel,
  ; where these modules are loaded and chain types are registered globally, so
  ; every state would read as "supported".
  (backend vm)
  (memory "2G")
  (cpus 2)
  (volumes
    ; The tree read-only, for the host-built binaries. This rig does not build
    ; in the guest: the subject is the kernel's answer, not the toolchain.
    (volume (host "../../..") (guest "/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
