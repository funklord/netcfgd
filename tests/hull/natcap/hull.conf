; What a kernel says when it cannot do NAT, in a guest whose module autoload
; this rig controls.
;
; The two states netcfgd's NAT sentence is about -- no `nft_chain_nat`, no
; `nft_masq` -- cannot occur on a host that has them, and a container or a
; namespace shares that host's kernel. A vm has a kernel of its own, boots with
; an empty module table, and has its own `/proc/sys/kernel/modprobe`: blocking
; autoload there makes a construct unreachable exactly as compiling it out
; would, because the lookup that fails does not care why the module is absent.
;
;     make hull-natcap   ; builds the image when it is absent, then runs
;     make hull-image    ; builds all four again, on purpose
;
; By hand, which is what the target does and needs no `cd`: hull resolves a
; spec's relative paths against the spec's own directory, and the build form
; below lives in this same file.
;     hull build -f tests/hull/natcap/hull.conf netcfgd/natcap
;     hull run   -f tests/hull/natcap/hull.conf
;
; **The image is built by hull rather than exported from docker**, since
; 2026-10-25. What that replaced and why is project.md 10.558; the short of it
; is that a `docker export` through `tar -x` as an ordinary user drops every
; owner and every setuid bit, so the old `bake-rootfs.sh` put the modes back
; with `chmod` from the image's own listing and could not put an owner back at
; all. A built image carries both in its manifest.
;
; **It needs a hull carrying `b7126fe`**, which made a materialized tree's root
; traversable. Before that the root was 0700, so no non-root uid could reach
; anything during a step: apt's download sandbox fell back to root and a
; maintainer script could not act as its own system user. The step checks for
; it rather than checking a version, because the property is what matters.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "natcap-tools")
      ; `(network true)`, without which `apt-get update` fetches nothing and
      ; exits 0 anyway -- which once read as four packages hull could not find.
      (network true)
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700, so nothing non-root'
	echo 'can run in a step: it needs b7126fe or later, and this file says why.'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends kmod iproute2
apt-get clean
# **The place for the host's modules**, which a slim image has no kernel to
# ship and a real Debian system has. hull mounts its module share at
# /usr/lib/modules/<release>; with a `dir:` source it made the place itself in
# the overlay, and with a stored source it did not -- so the image carries the
# parent and hull puts the release under it.
mkdir -p /usr/lib/modules
apt-get clean
command -v modprobe >/dev/null || { echo 'no modprobe in the image'; exit 1; }
command -v ip >/dev/null || { echo 'no ip in the image'; exit 1; }
echo \"natcap image: tree root $mode, kmod $(dpkg-query -W -f='${Version}' kmod)\"")
      (inputs))))
(machine
  (source "netcfgd/natcap")
  ; overlay, so the guest's writes are its own and go with it. Nothing is
  ; installed at run time; the build form above is where they come from, and
  ; the bake script that used to carry this is gone (project.md 10.558).
  (mutable overlay)
  ; **vm, and nothing else will do.** A container shares the host's kernel,
  ; where these modules are loaded and chain types are registered globally, so
  ; every state would read as "supported".
  (backend vm)
  (memory "2G")
  (cpus 2)
  (volumes
    ; **The host's modules, named rather than left to hull's own share.** hull
    ; mounts `/usr/lib/modules/<release>` itself for a `dir:` source above an
    ; overlay; measured 2026-10-25, it does not for a stored one -- the place
    ; is empty and the only 9p mount is the root. Reported to hull; meanwhile
    ; this is better than the implicit share anyway, because the whole tree is
    ; mounted rather than one release: the guest runs the host's kernel, so
    ; `uname -r` resolves inside, and nothing here pins a kernel version.
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    ; The tree read-only, for the host-built binaries. This rig does not build
    ; in the guest: the subject is the kernel's answer, not the toolchain.
    (volume (host "../../..") (guest "/repo") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
