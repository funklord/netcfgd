; Two machines on one wire, and a verdict from each of them.
;
; **This is a harness rather than a test of netcfgd.** 10.570 named the next
; hull step as a multi-machine delegation rig and named the hard part: the
; assertions are relational -- this host handed out a prefix, that host
; configured from it -- and a machine that never reached its payload must not
; read as a machine that passed. Both of those are properties of the harness,
; not of netcfgd, so they are built and proved here against a payload that does
; nothing interesting. The delegation logic lands on a wire already shown to
; work.
;
;     make hull-wire
;
; **The verdict channel is a shared writable volume**, one file per machine.
; The alternative was `hull exec` per machine from the host, which gives an
; exit status directly; a file was chosen because the collector then reads what
; each machine *said* as well as whether it passed, and because a machine that
; never ran leaves no file -- which is exactly the absence the vacuity guard
; has to notice. `hull exec` would have made the same absence a connection
; error, which is harder to tell from a machine that is merely slow.
;
; The image is `netcfgd/natcap`, which carries `iproute2` and nothing this rig
; needs beyond it. A smoke payload wants no more, and a rig that builds its own
; image for a reachability check would pay minutes for nothing.
(machines
  (isp
    (source "netcfgd/natcap")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "lan")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/payload.sh" "isp" "10.70.0.1/24" "cpe"))
  (cpe
    (source "netcfgd/natcap")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "lan")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/payload.sh" "cpe" "10.70.0.2/24" "isp")))
