; A repeater through four-address (WDS) mode, both ends netcfgd's in turn
; (project.md 10.587 item 4): four hwsim radios in one vm, each half against a
; reference end in namespaces. The regdom rig's image, which has hostapd,
; wpa_supplicant, iw and python3; the repository is
; mounted read-only and the payload runs the host's build of it.
;
;     make hull-wds    ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1536M")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
