; systemd-resolved, for what netcfgd tells it per link (project.md 10.908,
; 10.916): Debian trixie under its own systemd, with systemd-resolved, in a
; vm so resolved is a real system service on a bus.
;
;     make hull-resolved
;
; 10.908 left one gap open because no machine here ran resolved: a scope that
; stops stating `transport` or `dnssec` left resolved's per-link value as it
; was. Measuring it here found three more (10.916); the payload checks all
; four.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "resolved-systemd")
      (network true)
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends systemd systemd-sysv systemd-resolved udev dbus iproute2 kmod
apt-get clean
mkdir -p /usr/lib/modules
command -v resolvectl >/dev/null || { echo 'no resolvectl in the image'; exit 1; }
[ -x /sbin/init ] || { echo 'no /sbin/init in the image'; exit 1; }
echo \"resolved image: systemd $(systemctl --version | head -1 | cut -d' ' -f2)\"")
      (inputs))))

(machine
  (source "netcfgd/resolved")
  (mutable overlay)
  (backend vm)
  (init "/sbin/init")
  (memory "2G")
  (cpus 2)
  ; The host's kernel, so the host's modules below match it: hull's own is the
  ; default and carries no `dummy`.
  (tuning (vm (profile full)))
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "../../..") (guest "/mnt/repo") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
