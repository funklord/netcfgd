; The 6 GHz half of the regdom rig (project.md 10.585): two WPA3 access points
; in CA in one vm -- 5975 MHz, inside Europe's band, and 6455 MHz, above it --
; and a station in another, put in each domain in turn, with `relay.py`
; carrying hwsim's frames between them. Run by `make hull-regdom` after
; `wire5.conf`, on the same image. Each payload reports through ./verdict and
; exits 0.
(machines
  (ap6
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air6")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/ap6.sh"))
  (station6
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air6")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/station6.sh")))
