; The 5 GHz half of the regdom rig (project.md 10.585): three access points in
; US in one vm -- channel 36, radar channel 52, and 149 -- and a station in
; another, put in each domain in turn, with `relay.py` carrying hwsim's frames
; between them. Run by `make hull-regdom` after `wire.conf`, on the same
; image. Each payload reports through ./verdict and exits 0.
(machines
  (ap5
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air5")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/ap5.sh"))
  (station5
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air5")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/station5.sh")))
