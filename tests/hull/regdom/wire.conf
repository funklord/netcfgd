; The two-kernel half of the regdom rig (project.md 10.585): an access point
; on channel 13 in one vm, a station in another whose domain forbids it, and
; `relay.py` in each carrying mac80211_hwsim's frames across the segment.
; One kernel cannot hold this, because the regulatory domain is one setting per
; kernel and a country set by hand reaches every radio in it.
;
; Run by `make hull-regdom` after `hull.conf`, on the same image, whose build
; form is there. Each payload reports through ./verdict and exits 0.
(machines
  (ap
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    ; Up once its payload has written `UP` (hull's start order, hull 1330cae):
    ; the station is started only then, in place of polling for it.
    (ready (command "grep" "-q" "^UP" "/verdict/ap") (interval "1s") (timeout "2m"))
    (command "sh" "/payload/ap.sh"))
  (station
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (after ap)
    (command "sh" "/payload/station.sh")))
