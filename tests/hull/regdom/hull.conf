; What cfg80211 lets a running machine do with its regulatory domain, measured
; for decision 0296 (project.md 10.585). It measures the KERNEL, not netcfgd:
; nothing here builds or runs netcfgd, which is why the image has no compiler.
;
; A vm because the regulatory domain is one setting per kernel and the
; payload reloads cfg80211 to get a fresh one between experiments -- which a
; container sharing the host's kernel must never do, and the host cannot let
; it.
;
;     make hull-regdom   ; builds the image when it is absent, then runs
;
; The paths are relative to this directory, as hwsim's are.
(build
  (base "docker.io/library/debian:trixie-slim")
  (steps
    (step
      (name "regdom-tools")
      ; `(network true)`, without which `apt-get update` fetches nothing and
      ; exits 0 anyway -- hwsim's spec records what that once cost.
      (network true)
      (run "set -eu
mode=$(stat -c '%04a' /)
if [ $mode = 0700 ]; then
	echo 'this hull leaves a materialized tree root 0700, so nothing non-root'
	echo 'can run in a step: it needs b7126fe or later.'
	exit 1
fi
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends kmod iw hostapd wpasupplicant wireless-regdb iproute2 util-linux
apt-get clean
mkdir -p /usr/lib/modules
for t in modprobe iw hostapd wpa_supplicant wpa_cli ip unshare nsenter; do
	command -v $t >/dev/null || { echo \"missing from the image: $t\"; exit 1; }
done
# **The database, not the package.** CONFIG_CFG80211_REQUIRE_SIGNED_REGDB is
# set on the host kernel, so the file and its signature both have to be where
# the firmware loader looks, or every reading is the world domain.
for f in /lib/firmware/regulatory.db /lib/firmware/regulatory.db.p7s; do
	[ -e $f ] || { echo \"missing from the image: $f\"; exit 1; }
done
echo \"regdom image: tree root $mode\"")
      (inputs))))

(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    ; The host's modules: the guest runs the host's kernel, and mac80211_hwsim
    ; and cfg80211 are both modules there, which is what lets the payload
    ; reload cfg80211 for a fresh regulatory state.
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
