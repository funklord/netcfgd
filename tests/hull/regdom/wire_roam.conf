; The roam half of the regdom rig (project.md 10.585): four open access points
; on 2.4 GHz channel 1 in one vm -- one network advertising DE twice, one
; spanning a border, DE and US -- and a station in another that roams between
; them, with `relay.py` carrying hwsim frames. Run by `make hull-regdom` after
; `wire_rnr.conf`, on the same image. Each payload reports through ./verdict
; and exits 0.
(machines
  (ap-roam
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "airm")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    ; Up once its payload has written `UP` (hull's start order, hull 1330cae):
    ; the station is started only then, in place of polling for it.
    (ready (command "grep" "-q" "^UP" "/verdict/ap_roam") (interval "1s") (timeout "5m"))
    (command "sh" "/payload/ap_roam.sh"))
  (station-roam
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "airm")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (after ap-roam)
    (command "sh" "/payload/station_roam.sh")))
