; netcfgd's half of the regdom rig (decision 0296): the access point of
; `wire.conf`, and a station running the daemon built on the host, which says
; who set the regulatory domain as the station joins, leaves, and has a
; country set by hand. Unlike the rest of this rig it measures netcfgd, which
; is why it has a target of its own -- `make hull-regdom-heard`, which builds
; the C first -- and the repository mounted read-only.
(machines
  (ap-heard
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    ; Up once its payload has written `UP` (hull's start order, hull 1330cae):
    ; the station is started only then, in place of polling for it.
    (ready (command "grep" "-q" "^UP" "/verdict/ap_heard") (interval "1s") (timeout "2m"))
    (command "sh" "/payload/ap.sh" "ap_heard" "station_heard"))
  (station-heard
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "air")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (after ap-heard)
    (command "sh" "/payload/station_heard.sh")))
