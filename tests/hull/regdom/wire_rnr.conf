; The RNR half of the regdom rig (project.md 10.585): one network, home, on
; 5 GHz with a Reduced Neighbour Report naming its 6 GHz twin, in a CA vm, and
; a station in another put in each domain in turn, with `relay.py` carrying
; hwsim frames between them. Run by `make hull-regdom` after `wire6.conf`, on
; the same image. Each payload reports through ./verdict and exits 0.
(machines
  (ap-rnr
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "airr")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/ap_rnr.sh"))
  (station-rnr
    (source "netcfgd/regdom")
    (mutable overlay)
    (backend vm)
    (memory "1G")
    (cpus 2)
    (segments "airr")
    (volumes
      (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro)))
    (command "sh" "/payload/station_rnr.sh")))
