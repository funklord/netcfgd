; An IPsec tunnel on OpenWrt 25.12 (project.md 10.870, 10.872): netcfgd's
; package and OpenWrt's own strongSwan, each under procd, on the image
; `hull-openwrt` builds. The router is the guest's root namespace; the far
; end is a second charon in a network namespace. See payload.sh for what is
; checked and what this rig is not.
;
;     make hull-openwrt-ipsec   ; fetches OpenWrt's strongSwan, then runs
;
; 256 MB rather than 128: the server charon is test furniture a router does
; not carry, and netcfgd alone left 2.4 MB available at 128 (hull-openwrt).
(machine
  (source "netcfgd/openwrt")
  (mutable overlay)
  (backend vm)
  (init "/sbin/init")
  (memory "256M")
  (cpus 1)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "sh" "/payload/payload.sh"))
