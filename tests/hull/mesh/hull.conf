; netcfgd joining an 802.11s mesh (project.md 10.588): two hwsim radios in one
; vm, netcfgd's node on one and a bare wpa_supplicant node on the other in a
; network namespace. The regdom rig's image, which has wpa_supplicant, iw
; and python3 and nothing netcfgd-specific; the repository is
; mounted read-only and the payload runs the host's build of it.
;
;     make hull-mesh   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
