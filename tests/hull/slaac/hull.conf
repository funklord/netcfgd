; SLAAC against a router advertisement, on an interface that forwards --
; tests/live/slaac.sh's half that needs an advertiser, with hull as the
; advertiser rather than dnsmasq (project.md 10.624). A chroot machine with no
; network of its own and one IPv6 segment that hull advertises; the repository
; mounted read-only and the payload running the host's build of netcfgd.
;
;     make hull-slaac   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend chroot)
  (network none)
  (segments (ra (subnet6 "fd42:84::/64") (advertise true)))
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
