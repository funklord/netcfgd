; Autonegotiation, speed and duplex set by netcfgd on a real driver
; (project.md 10.877): virtio-net, in a hull vm. A veth refuses every
; link-modes set and a namespace has no other Ethernet, so this is the first
; place the encoder meets a kernel driver that takes one.
;
;     make hull-link-modes
;
; The NIC under test is `eth1`, a bare segment's, so the machine's own
; network on `eth0` is never touched. virtio-net takes a speed and duplex
; only with autonegotiation off (`ethtool_virtdev_set_link_ksettings`), and
; reports what it was given whether or not anything is on the wire.
;
; The hwsim rig's image, which has what this needs; `make hull-image`
; rebuilds it. The paths are relative to this directory.
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  ; **q35 and the host's kernel, not a microvm**: a microvm's virtio is on
  ; MMIO, which has no queue reset, and virtio-net resizes a ring only with
  ; one -- measured, `ethtool -G` itself answered ENOENT there. On PCI,
  ; qemu's virtio-net offers it (project.md 10.881).
  (tuning (vm (profile full)))
  (memory "1G")
  (cpus 2)
  (segments "lm")
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
