; netcfgd on a 64-bit ARM kernel, under procd (project.md 10.814): OpenWrt's own
; armsr-armv8 build, the generic one for qemu's `virt`, kernel and rootfs together,
; in qemu-system-aarch64, running what `hull-malta` runs on big-endian MIPS --
; `tests/hull/openwrt/payload.sh` and malta's `guest.sh` -- with the package for
; `aarch64_generic` made and installed by apk. Most routers sold now are arm64
; (MediaTek's Filogic, Qualcomm's IPQ807x and later), so this is the program and
; package such a router gets, built with OpenWrt's own toolchain, against musl.
;
; The image has no wireless stack -- no cfg80211, no wpad, no iw -- so the radio
; half is not run here and the verdict says so; malta's image runs it.
;
; A vm carrying a second emulator, as malta's does. Everything fetched is pinned
; by checksum.
;
;     make hull-armsr
(build
  (base "docker.io/library/debian:12")
  (steps
    (step
      (name "armsr-tools")
      (network true)
      (run "set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get -qq update
apt-get -qq install -y --no-install-recommends qemu-system-arm make python3 cpio zstd curl ca-certificates file gcc libc6-dev meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev kea-dhcp6-server iproute2 ppp pppoe procps kmod tcpdump
# OpenWrt 25.12, whose packages are apk-tools 3's, so apk-tools 3.0.2 is built
# here as the Makefile's `apk-tools` builds it, pinned by the same hash (10.813).
# 25.12.6, the point release a router flashed today runs, not 25.12.0: among
# what changed between them, odhcp6c's ADVERTISE parsing (10.815).
base=https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8
kernel=openwrt-25.12.6-armsr-armv8-generic-initramfs-kernel.bin
toolchain=openwrt-toolchain-25.12.6-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
kmods=kmods/6.12.112-1-67e205f26d0458c4d12f1fd315216398
apktools=https://gitlab.alpinelinux.org/alpine/apk-tools/-/archive/v3.0.2/apk-tools-v3.0.2.tar.gz
# uradvd, the advertisement daemon 25.12 has where it has no radvd (project.md 10.817),
# installed in the guest from this file as a person would from the feed.
uradvd=https://downloads.openwrt.org/releases/25.12.6/packages/aarch64_generic/packages/uradvd-2025.09.20~1e64364d-r1.apk
mkdir -p /armsr/toolchain /armsr/module /armsr/veth /armsr/apk-tools
cd /armsr
curl -fsSo Image $base/$kernel
curl -fsSo toolchain.tar.zst $base/$toolchain
curl -fsSo dummy.apk $base/$kmods/kmod-dummy-6.12.112-r1.apk
curl -fsSo veth.apk $base/$kmods/kmod-veth-6.12.112-r1.apk
curl -fsSLo apk-tools.tar.gz $apktools
curl -fsSo uradvd.apk $uradvd
sha256sum -c <<'SUMS'
2b1f0796ec31201b609643beca48de20d75f2879104a20adba327cbaf64b5f2b  Image
3daaf41e6d7416183dfaa7ddb35c5c6743c5101200046e3fc26af8a89dab1148  toolchain.tar.zst
ef733bcc61130e4aecee6746315ca938e235eb0ca958329212e83238caa56ac4  dummy.apk
233282eb152179bf18efc9f5383dca35d8fe838a2c04aa1ec29509306269e9d4  veth.apk
987cef95e3b1cb3a365e016c9ab2566aaf440bccdc15a1650cdd0cd5ea3209e4  apk-tools.tar.gz
fcae5cbe45adc596a68b55ff7f506754f5c915bc0f087026bcc94483199b3797  uradvd.apk
SUMS
tar --zstd -xf toolchain.tar.zst -C toolchain --strip-components=1
tar xzf apk-tools.tar.gz -C apk-tools
meson setup apk-tools/build apk-tools/apk-tools-v3.0.2 -Ddocs=disabled -Dhelp=disabled -Dlua=disabled -Dpython=disabled -Dtests=disabled > /dev/null
ninja -C apk-tools/build > /dev/null
apk=/armsr/apk-tools/build/src/apk
$apk extract --allow-untrusted --destination module dummy.apk
$apk extract --allow-untrusted --destination veth veth.apk
ls toolchain/toolchain-*/bin/aarch64-openwrt-linux-musl-gcc module/lib/modules/*/dummy.ko
ls veth/lib/modules/*/veth.ko $apk
rm toolchain.tar.zst dummy.apk veth.apk apk-tools.tar.gz")
      (inputs))))

(machine
  (source "netcfgd/armsr")
  (mutable overlay)
  (backend vm)
  ; The host's kernel and its modules rather than hull's own, which has no tun:
  ; the two ISPs are on taps (project.md 10.815).
  (tuning (vm (profile full)))
  (memory "2G")
  (cpus 4)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
