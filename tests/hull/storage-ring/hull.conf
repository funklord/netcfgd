; The storage net the holder's three boxes are to get (project.md 10.887):
; ConnectX-3s in Ethernet mode, two ports each, cabled box to box with no
; switch. Bridged, the cables close a ring -- ml350 to -01, -01 to -03, -03
; back to ml350 -- so spanning tree has to block one port or every
; broadcast circles for ever. Each machine runs netcfgd with its two ports
; in a bridge with STP on, MTU 9000, and its storage address; then each
; pings the other two with a full jumbo frame that may not fragment.
;
;     make hull-storage-ring
;
; The holder chose the bridge (project.md 10.889), which needs spanning
; tree; after the pings a cable is cut and the ring must heal. virtio-net stands in
; for mlx4. The hwsim rig's image, on the host's kernel: hull's microvm
; kernel has no bridge module.
(machines
  (ml350
    (source "netcfgd/hwsim")
    (mutable overlay)
    (backend vm)
    (tuning (vm (profile full)))
    (network none)
    (memory "1G")
    (cpus 1)
    (segments "a" "c")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (command "sh" "/payload/payload.sh" "ml350" "10.1.0.5" "10.1.0.1 10.1.0.3"))
  (dl180g6-01
    (source "netcfgd/hwsim")
    (mutable overlay)
    (backend vm)
    (tuning (vm (profile full)))
    (network none)
    (memory "1G")
    (cpus 1)
    (segments "a" "b")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (command "sh" "/payload/payload.sh" "dl180g6-01" "10.1.0.1" "10.1.0.5 10.1.0.3"))
  (dl180g6-03
    (source "netcfgd/hwsim")
    (mutable overlay)
    (backend vm)
    (tuning (vm (profile full)))
    (network none)
    (memory "1G")
    (cpus 1)
    (segments "b" "c")
    (volumes
      (volume (host "./verdict") (guest "/verdict") (mode rw))
      (volume (host ".") (guest "/payload") (mode ro))
      (volume (host "../../..") (guest "/repo") (mode ro)))
    (command "sh" "/payload/payload.sh" "dl180g6-03" "10.1.0.3" "10.1.0.1 10.1.0.5")))
