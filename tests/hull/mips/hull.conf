; The C suite as big-endian 32-bit MIPS code, the ABI of a great many OpenWrt
; routers (project.md 10.742): `make c-32` is little-endian with 4-byte `int64_t`
; alignment, so it says nothing about byte order or about 8-byte alignment.
;
; A vm rather than a chroot because the guest has to register `binfmt_misc`,
; which is how a test that starts `c/netcfgd` gets it run by qemu. Bookworm
; because trixie dropped the toolchain. The compiler is in the guest, so nothing
; is installed on this machine.
;
;     make hull-mips
(build
  (base "docker.io/library/debian:12")
  (steps
    (step
      (name "mips-tools")
      (network true)
      (run "export DEBIAN_FRONTEND=noninteractive; apt-get -qq update && apt-get -qq install -y --no-install-recommends gcc-mips-linux-gnu libc6-dev-mips-cross qemu-user-static make kmod python3 procps iproute2 file")
      (inputs))))

(machine
  (source "netcfgd/mips")
  (mutable overlay)
  (backend vm)
  (memory "4G")
  (cpus 4)
  (volumes
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
