; WPA3 fast roaming between two access points, each run by its own netcfgd
; (project.md 10.587): three hwsim radios in one vm, one access point in the
; root namespace and one in namespace `b`, each in its own bridge and the
; bridges joined by a veth -- two machines' worth, sharing only the
; configuration and the secrets. The regdom rig's image.
;
;     make hull-roam-sae   ; builds the C, and the image when it is absent
(machine
  (source "netcfgd/regdom")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
