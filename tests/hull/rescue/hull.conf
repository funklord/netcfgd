; netrescue (0326) climbing to its last rung in a vm, where the driver rebind
; it does there meets a real driver: virtio-net, through the real sysfs
; `unbind` and `bind` (project.md 10.879).
;
;     make hull-rescue
;
; netrescue is handed a ports directory naming only `eth1`, the bare
; segment's NIC, with a carrier file saying there is none and a `device`
; link to the real device -- so the ladder climbs, the forcing rungs act on
; virtio, and the rebind follows the real links. The machine's own network
; on `eth0` is not one of its ports. The hwsim rig's image.
(machine
  (source "netcfgd/hwsim")
  (mutable overlay)
  (backend vm)
  (memory "1G")
  (cpus 2)
  (segments "rescue")
  (volumes
    (volume (host "/lib/modules") (guest "/usr/lib/modules") (mode ro))
    (volume (host "./verdict") (guest "/verdict") (mode rw))
    (volume (host ".") (guest "/payload") (mode ro))
    (volume (host "../../..") (guest "/repo") (mode ro)))
  (command "sh" "/payload/payload.sh"))
