<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  Who may own and reach org.freedesktop.NetworkManager, when netcfgd-nm is
  what answers to it.

  THIS FILE EXISTS BECAUSE THE GRANT IS OTHERWISE SOMEBODY ELSE'S. The shim
  can claim that bus name today only because NetworkManager's own package
  ships a policy granting root the right to own it. Remove that package and
  the grant leaves with it, so the shim would fail to claim the name on
  exactly the machine that most wants it, and every client method call would
  be denied by the system bus default. A shim whose whole purpose is to answer
  where NetworkManager used to cannot depend on NetworkManager being
  installed.

  ONLY ALLOWS, DELIBERATELY. A file here is merged with every other, later
  rules winning, so a `deny` of ours could silently override an allow in
  NetworkManager's file on a machine running the real thing. The system bus
  default is already `deny own="*"` and `deny send_type="method_call"`, which
  is what makes allow-only sufficient: nothing here widens anything beyond the
  name it mentions.

  Owning is root's, because the shim runs as root. It has to be, to be reachable
  at the same address NetworkManager was. Nothing unprivileged can take the
  name from it.

  THE SEND LIST IS THE SHIM'S OWN SURFACE, not a copy of NetworkManager's.
  NetworkManager grants sends on interfaces for modems, WiMax, Bluetooth,
  OLPC mesh and a dozen VPN plugins, none of which this implements and none of
  which it should invite calls on. `tools/dbus_policy_gate.py` reads the
  interfaces out of the shim's source and fails when this file and the code
  disagree, in either direction, because the failure is silent otherwise: a
  missing interface here is a client method call denied at run time, and only
  on a machine where NetworkManager's package is absent, which is the one
  configuration nobody tests by accident.
-->
<busconfig>
	<policy user="root">
		<allow own="org.freedesktop.NetworkManager"/>
		<allow send_destination="org.freedesktop.NetworkManager"/>
	</policy>

	<policy context="default">
		<!-- The three every D-Bus service answers. Without Properties and
		     ObjectManager a client cannot read a single value, and nmcli
		     enumerates the whole tree through ObjectManager before it does
		     anything else. -->
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.DBus.Introspectable"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.DBus.Properties"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.DBus.ObjectManager"/>

		<!-- The manager itself, and the settings tree. -->
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Settings"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Settings.Connection"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Connection.Active"/>

		<!-- Devices. The list is what the shim answers for; a link kind it
		     reports as GENERIC needs no interface of its own. -->
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Wired"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Wireless"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Bridge"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Bond"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Vlan"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.WireGuard"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Loopback"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.Device.Generic"/>

		<!-- Wireless scan results, and the addresses actually applied. -->
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.AccessPoint"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.IP4Config"/>
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.IP6Config"/>

		<!-- Any process may talk to the AgentManager to register itself as a
		     secret agent. Only the shim talks to the agents, and it does so
		     one way: a credential travels inbound and is never handed back
		     (0031). `GetSecrets` refuses whoever asks. -->
		<allow send_destination="org.freedesktop.NetworkManager"
		       send_interface="org.freedesktop.NetworkManager.AgentManager"/>
		<allow send_interface="org.freedesktop.NetworkManager.SecretAgent"/>
	</policy>
</busconfig>
