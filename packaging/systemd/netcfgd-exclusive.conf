# Opt-in: stop every other network manager when netcfgd starts.
#
#   mkdir -p /etc/systemd/system/netcfgd.service.d
#   cp netcfgd-exclusive.conf /etc/systemd/system/netcfgd.service.d/
#
# This is the blunt instrument, and it is a separate file because it is a
# different decision from running netcfgd at all. netcfgd's own contention
# check is per-device: it will tell you which interfaces another daemon claims
# and leave the two coexisting if that is what you want. This says instead that
# netcfgd is the only network daemon on the machine.
#
# Done through the init system rather than by netcfgd stopping processes
# itself. A network daemon that kills other daemons is a surprise nobody wants
# to debug, and systemd already has the mechanism.

[Unit]
# **`Conflicts=` alone does not order anything**, and without the `After=`
# below this drop-in produced an intermittent failure rather than a reliable
# one. systemd.unit(5) is explicit: "this setting does not imply an ordering
# dependency ... to ensure that the conflicting unit is stopped before the
# other unit is started, an After= or Before= dependency must be declared."
#
# Unordered, netcfgd can reach its contention check while NetworkManager is
# still shutting down. NM is then genuinely alive, genuinely still claims the
# radio, and netcfgd correctly declines it -- for a daemon that is one second
# from gone. Whether that happens depends on how fast NM exits, which is why
# the operator saw it work sometimes and not others.
#
# After= on a unit being stopped means "after the stop job finishes", which is
# exactly the ordering wanted here.
After=NetworkManager.service
After=systemd-networkd.service
After=connman.service
After=wpa_supplicant.service
After=ModemManager.service

Conflicts=NetworkManager.service
Conflicts=systemd-networkd.service
Conflicts=connman.service
# `wpa_supplicant.service` is the one this file was missing, and its absence
# is why "netcfgd stops working if I don't have NetworkManager running" was a
# real report rather than a confusion. On Debian that unit is enabled and runs
# independently of NetworkManager, parented to systemd -- so stopping NM leaves
# its control socket answering on the radio, netcfgd's guard sees a supplicant
# it did not start, and it declines the radio for ever. The machine ends with
# no manager at all.
#
# Conflicting with the *service* does not deny netcfgd a supplicant: netcfgd
# starts its own with `-B ... -P /run/netcfgd/supplicant/<iface>.pid`, directly
# rather than through this unit. What has to go is the system-wide D-Bus-mode
# instance another manager drives.
Conflicts=wpa_supplicant.service
# ModemManager owns WWAN devices the same way, and netcfgd's mbim backend is
# the same collision one layer down.
Conflicts=ModemManager.service
