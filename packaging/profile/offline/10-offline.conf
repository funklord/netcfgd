# The offline profile: this machine does no networking.
#
# Select it with `ncfg profile set offline`, and come back with
# `ncfg profile set <something else>` or `ncfg profile unset`.
#
# WHAT THIS DOES
#   Every interface goes down and every address netcfgd owns is withdrawn.
#   That is one host-wide key rather than a list of interfaces, because a
#   shipped profile cannot know what this machine's interfaces are called.
#
# WHAT IT IS NOT
#   It is not `managed = false`. Unmanaged means netcfgd does not touch an
#   interface, so whatever address it already had stays and the machine keeps
#   talking -- the opposite of what somebody choosing this profile is asking
#   for.
#
#   It is also not "no profile chosen". No profile chosen is the default and
#   means the machine runs its own configuration. Choosing this one is a
#   statement.
#
# BEFORE YOU SELECT IT OVER A NETWORK
#   This takes the link down. `ncfg apply --confirm 60` gives you a way back:
#   the change reverts on its own unless you confirm it, so a mistake costs a
#   minute rather than a drive.

global {
	networking = "off"
}
