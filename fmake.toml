# What fmake builds here, and what it leaves to make.
#
# The Qt client is fmake's, below. The daemon and the CLI are `make -C c`'s,
# for the reasons the `[project]` comment gives. The Cargo workspace this file
# used to exclude -- fmake drives rustc one crate root at a time and resolves
# no workspace -- was retired by 0317.
[project]
# `c` and `fuzznet` too: the C daemon is `make -C c`'s, with fuzznet built under
# flags of its own, and fmake was stopping there before it reached the client (its
# fuzz harnesses each define `ncfg_fuzz_one`). `client/fuzz` likewise: programs of
# their own that `make fuzz` builds. `bridge` needs fuzznet, and `gui/src/phone` is
# the Android build's, with a camera a desktop build has no Qt module for.
exclude = ["adapter", "c", "fuzznet", "client/fuzz", "bridge", "gui/src/phone"]

# The Qt client, `make gui`. fmake names a target after the directory its
# root TU sits in; `gui` is a directory in the way here, so it falls back to
# ncfg_gui, which is nobody's name for it. gui/Makefile calls it netcfgd-gui
# and so does `make install-gui`.
#
# Worth knowing that fmake builds this in one graph where the project keeps
# two: gui/Makefile builds ../client/libncfg_client.a first and links it,
# and fmake compiles the client sources straight into the program because
# symbol closure reaches them. Same program, one fewer artifact, and no
# CLIENT_DIR to keep pointed anywhere.
[target.gui]
name = "netcfgd-gui"
