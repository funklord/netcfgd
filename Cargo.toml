[workspace]
resolver = "2"
# fuzz/ is built by cargo-fuzz with nightly and a sanitizer, never by
# `cargo build`. Excluding it keeps the workspace buildable on stable.
#
# adapters/ is excluded for a different reason and a more important one:
# design section 9.2 says an adapter's dependencies are its own package's
# only, and that the core's dependency manifest never gains an entry. A shared
# workspace means a shared lockfile and a shared `cargo-deny` graph, which
# would put the NM shim's D-Bus stack inside the gate that keeps this tree at
# libc and serde. Each adapter is its own workspace with its own lockfile;
# `make nm-containment` is the mechanically checkable assertion 9.2 asks for.
exclude = ["fuzz", "adapters/netcfgd-nm"]
members = [
	"crates/netcfgd-model",
	"crates/netcfgd-compile",
	"crates/netcfgd-plan",
	"crates/netcfgd-sys",
	"crates/netcfgd-observe",
	"crates/netcfgd-apply",
	"crates/netcfgd-proto",
	"crates/netcfgd-secret",
	"crates/netcfgd-host",
	"crates/netcfgd-daemon",
	"backends/netcfgd-dns",
	"backends/netcfgd-supplicant",
	"backends/netcfgd-hostapd",
	"backends/netcfgd-openvpn",
	"backends/netcfgd-ra",
	"crates/netcfgd-cli",
	"crates/netcfgd-bin",
	# Test scaffolding, and a dev dependency wherever it is used -- nothing links
	# it into a binary, so it is in no tier and costs the size budget nothing.
	"crates/netcfgd-testdir",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/netcfgd/netcfgd"

[workspace.lints.rust]
unsafe_code           = "forbid"
missing_docs          = "warn"
unreachable_pub       = "warn"
rust_2018_idioms      = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The model is a schema. Its enums are wide by design and its field names are
# the wire format, so two pedantic lints fight the spec rather than improving it.
module_name_repetitions = "allow"
struct_excessive_bools  = "allow"

[workspace.dependencies]
# std for now: the IpAddr serde impls live behind serde's std feature. The nano
# tier's concern is serde_json rather than serde, and section 6 already plans to
# hand-roll CBOR there; revisit at M5 rather than guessing now.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Size posture, project.md section 6. These are gates, not preferences: the nano tier
# budget is 400 KB and a budget adopted later is a budget already blown.
[profile.release]
opt-level        = "z"
lto              = true
codegen-units    = 1
panic            = "abort"
strip            = true
overflow-checks  = true

# Tests need unwinding, so they cannot inherit panic = "abort" above.
[profile.test]
opt-level = 0
