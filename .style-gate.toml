# Configuration for tool/style_gate.py -- see code-style.md.
# Nothing here changes the rules; it says which files in THIS tree they
# apply to, and how small the file list may get before a pass is a lie.

# Migration only: the columns a level occupied before this tree was
# converted. Checking never reads it -- a tab carries the level and the
# viewer decides how wide it looks.
indent_width = 4

# A fraction of the raw population: the gated count must be at least this
# share of every path git lists, before excludes and extension selection
# run. Those filters are what a bad edit collapses, so the baseline sits
# upstream of the failure this guards, and it moves with the tree -- the
# absolute floors this replaces had decayed to between 22% and 80% of
# their real counts, each right on the day it was written and silent
# after. Half the ratio measured on migration day, so a collapse of more
# than half the gated share fires and adding files never does. It catches
# a collapse; no floor can catch a single module dropping out, since that
# needs a value within one module of the real count, which fires on every
# legitimate addition.
floor = 0.25

ascii_only = true

# `determinism` joins `schema` for the same reason: both hold generated
# witnesses rather than files this project writes by hand, and both are
# compared byte for byte. `tests/determinism/` carries a deliberately
# non-ASCII SSID, which code-style.md names as an exception outright -- "a
# fixture for a UTF-8 parser" -- and which is the whole point of the fixture,
# since a document that survives three architectures unchanged has to survive
# them with its multi-byte characters intact.
#
# Excluded here rather than by teaching the shared gate a per-path ASCII
# exemption: that tool is copied into every project and changing it is a
# cross-project decision, not a thing to do while passing.

# The gate's own defaults, plus this tree's one addition. Listing a value
# here REPLACES the default list rather than adding to it, so the defaults
# are repeated deliberately -- dropping `target` would put a cargo build
# tree in front of every check.
#
# `schema` is `doc/schema`, generated output whose bytes are pinned:
# netcfgd writes those four witnesses and `make check` compares them byte
# for byte against what the model produces. code-style.md exempts generated
# sources for exactly this reason, and adopting the gate here without the
# exemption added a final newline to `document.json` -- which no generator
# writes -- leaving `make check` red on master with "the document schema has
# changed" and a difference at the end of a file nobody had edited.
#
# A bare component name rather than `doc/schema`, because the gate matches
# entries against each path component and a multi-segment prefix therefore
# never matches anything. `schema` is the only directory of that name in this
# tree, so the two are equivalent here -- but the gate accepting a path that
# silently matches nothing is worth raising against the shared tool rather
# than working around in seven copies of it.
exclude = ["attic", "third_party", "vendor", "build", "target",
           "dist", ".pytest_cache", ".claude", "schema", "determinism"]
