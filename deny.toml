# cargo-deny. Section 6 lists it alongside cargo-audit as the supply-chain
# gate; `make deny` runs both where they are installed.
#
# The interesting part of this file is how little it has to say. Constraint 3
# keeps the dependency set at libc and the kernel, and the only third-party
# crates in the tree are serde, serde_json and libc -- so the bans section
# below is not aspirational tidiness, it is the constraint written down where
# a tool can check it.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "aarch64-unknown-linux-gnu" }]

[advisories]
yanked = "deny"

[licenses]
# Permissive only. A copyleft dependency would change the terms under which
# netcfgd itself can be distributed, which is not a decision to make by
# accident in a lockfile.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.9

[bans]
# One version of anything. Two versions of the same crate in one binary is
# bytes paid twice against a budget the size gate is already fighting for.
multiple-versions = "deny"
wildcards = "deny"

# Everything netcfgd is allowed to depend on, transitively. Adding a line here
# is the moment to ask whether constraint 3 still holds -- which is the whole
# point of writing the list down rather than trusting review.
allow = [
	{ crate = "libc" },
	{ crate = "serde" },
	{ crate = "serde_core" },
	{ crate = "serde_derive" },
	{ crate = "serde_json" },
	{ crate = "itoa" },
	{ crate = "zmij" },  # serde_json's float formatter; replaced ryu upstream
	{ crate = "memchr" },
	{ crate = "proc-macro2" },
	{ crate = "quote" },
	{ crate = "syn" },
	{ crate = "unicode-ident" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
