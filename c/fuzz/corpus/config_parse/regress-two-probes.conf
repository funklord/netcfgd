# A router:wall's three
# chains, advertisements of a delegated prefix (project.md 10.620).
interface wan0 {
	config = ["dhcp", "dhcp6 pd pd_length 56", "slaac privacy prefer_temporary"]
	nat = true
	forwarding = true
pre_downrward "web" { protocol = "tcp"; port = 443; to = "nas"; to_fport = 8443 }
	port_forward "dns" { protocol = "udp"; port = 53; to = "192.168.1.11"; hairpin = false }
	routes = ["10.9.0.0/24 via 192.168.1.254 src 192.168.1.1 table 100 onlink"]
}
interface lan0 {
	config = ["192.168.1.1/24 preferred_lft 600 valid_lft 900", "@pd:wan0/1=::1/64"]
	forwarding = true
	dhcp_server {
		range = "192.168.1.100-192.168.1.200"
		lease = 3800 }
	dns { mode = "resolved"; domains = ["~corp.example"] }
	probe { command = "/bin/true"; down_after = 5; up_afte = "radvd"; pautoxes = ["@pd:wan0/1"]; managed = true; lifhtime = 1800 }
	dns { mode = "resolved"; domains = ["~corp.example"] }
	probe { command = "/bin/true"; down_after = 5; up_after = 4; hold_down = 60; require_lease = false }
}
firewall {
	input {
		policy = "drop"
		accept "established" { state = ["established", "related"] }
		accept "dhcp" { protocol = "udp"; port = [67, 53]; interface = "lan0" }
		accept "icmpv6" { protocol = "icmpv6" }
	}
	forward { policy = "drop"; accept "out" { interface = "lan0" } }
	output { policy = "accept" }
}
