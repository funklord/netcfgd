# What CI is for here, and what it is not.
#
# `make check` is the gate and it already runs on a developer's machine. What
# this adds is the two things a laptop cannot say: that a *clean* checkout
# builds with no stale artifact helping it, and that the second platform this
# project actually targets still works.
#
# It deliberately does **not** run `make live`. Those 37 scripts drive real
# daemons -- dhcpcd, dnsmasq, hostapd, wpa_supplicant, openvpn -- and several
# need namespaces or real root; three of them make their own namespaces and
# must be run bare. Pretending to run them here would be worse than not: a
# green tick over a suite that skipped everything is the vacuous pass this
# project keeps finding. They stay a thing somebody runs, and section 10 says
# where.
#
# YAML is spaces, per code-style.md's settled exception: the spec forbids tabs
# for indentation outright.
name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push while the first is still running makes the first irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Qt, because `make gui` skips loudly rather than failing when qmake is
      # absent -- which is right on the routers this mostly builds for, and
      # would be a vacuous pass here. This is the one machine that should
      # always compile the Qt client.
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev

      # `gui` turns into a skip when qmake is absent, which is right on a
      # machine with no desktop and wrong here. This is the runner that must
      # actually run it, so a package that failed to install has to fail the
      # job rather than quietly shorten the gate list: a skip nobody reads is
      # the vacuous pass this project keeps finding.
      - name: Check the toolchain has what the gates need
        run: command -v qmake6

      # `check-ci` is `check` minus the budget gates, and the Makefile says
      # why: they are ratchets on a measurement, and a rented VM measures the
      # VM. It shares one gate list with `check`, so a gate added there is
      # added here by construction rather than by somebody remembering.
      #
      # Not a step list written out in this file, which is what this replaced:
      # that could drift from `check` silently, and the drift would be a gate
      # nobody ran.
      - name: make check-ci
        run: make check-ci

  musl:
    name: build and test (musl)
    runs-on: ubuntu-latest
    # The second platform, and the hostile one: project.md records that running
    # the same tree under musl and busybox is where `kill -0` was caught calling
    # a zombie alive. Worth a job of its own precisely because it has found
    # things glibc did not.
    container: alpine:latest
    steps:
      - name: Install the toolchain
        run: apk add --no-cache make build-base linux-headers python3 git

      - uses: actions/checkout@v4
        with:
          submodules: true

      # Not `make check`: the conventions it enforces are platform-independent
      # and the job above already ran them, so repeating them here would spend
      # minutes to learn nothing. What is not platform-independent is whether
      # this builds and passes its tests against musl, which is what this asks.
      # The C since 0317; this ran `cargo test` while the Rust was in the tree.
      - name: make c-test
        run: make c-test
